name: iOS
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
jobs:
  build:
    # Compiles the app without signing, to catch build errors before you open
    # Xcode. Installing on a phone still needs signing (Xcode or TestFlight).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild build -project Walkie.xcodeproj -scheme Walkie \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="" \
            > build.log 2>&1 || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            # GitHub keeps only 10 annotations per step, so join lines with %0A.
            echo "::error::$(grep -E 'error:' build.log | sed 's#.*/ios/Walkie/##' | sort -u | head -150 | awk '{printf "%s%%0A", $0}')"
            echo "::warning::$(tail -40 build.log | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: ios/build.log
