name: Android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write   # to publish the APK on the "android-latest" release
jobs:
  build:
    runs-on: ubuntu-latest   # has the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Optional: add the Firebase file as a repository secret named
      # GOOGLE_SERVICES_JSON (Settings > Secrets and variables > Actions)
      # so the APK can be woken by push. Without it the app still builds.
      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log || {
            # Surface compiler errors as annotations (readable through the API).
            # GitHub keeps only 10 annotations per step, so join lines with %0A.
            echo "::error::$(grep -E '^e: |What went wrong|^> |error:|Error: |Errors? found|^\s+~|^\s+[A-Za-z].*\^' build.log | sed 's#file:///home/runner/work/walkie/walkie/android/app/src/main/java/com/debayandatta/walkie/##' | head -150 | awk '{printf "%s%%0A", $0}')"
            echo "::warning::$(grep -B2 -A4 'Error: ' build.log | head -120 | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: walkie-android-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish to the "android-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk walkie.apk
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Hollo for Android (test build)" \
              --notes "Latest Hollo Android build. Download walkie.apk and install it on the phone."
          gh release upload android-latest walkie.apk --clobber
          gh release edit android-latest --notes "Latest Hollo Android build ($(git rev-parse --short HEAD), $(date -u +'%Y-%m-%d %H:%M UTC')). Download walkie.apk and install it on the phone."
